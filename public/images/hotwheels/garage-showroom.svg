    <ellipse cx="830" cy="345" rx="330" ry="235" fill="url(#cloudR)"/>
    <ellipse cx="1260" cy="330" rx="300" ry="225" fill="url(#cloudT)"/>
    <ellipse cx="560" cy="430" rx="260" ry="170" fill="url(#cloudO)"/>

