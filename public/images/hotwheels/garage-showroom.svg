        <rect x="460" y="40" width="34" height="13" rx="3"/><rect x="625" y="40" width="34" height="13" rx="3"/>
        <rect x="791" y="40" width="34" height="13" rx="3"/><rect x="956" y="40" width="34" height="13" rx="3"/>
        <rect x="1122" y="40" width="34" height="13" rx="3"/><rect x="1287" y="40" width="34" height="13" rx="3"/>
        <rect x="1453" y="40" width="34" height="13" rx="3"/>
