      <path d="M 470 198 C 588 183 662 250 656 352 C 650 462 558 508 468 492 C 378 476 348 400 354 310 C 360 226 402 203 470 198 Z" stroke="#d92b2b" stroke-width="84"/>
      <path d="M 762 208 L 748 500 M 934 198 L 920 492 M 754 356 L 926 346" stroke="#7cc4e0" stroke-width="84"/>
      <path d="M 1012 496 L 1108 212 L 1204 492 M 1048 402 L 1170 394" stroke="#ece7dc" stroke-width="84"/>
      <path d="M 1292 496 L 1306 210 L 1466 468 L 1480 204" stroke="#d92b2b" stroke-width="84"/>
