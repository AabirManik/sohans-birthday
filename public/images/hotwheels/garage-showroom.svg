        <ellipse cx="477" cy="56" rx="12" ry="5.5"/><ellipse cx="642" cy="56" rx="12" ry="5.5"/>
        <ellipse cx="808" cy="56" rx="12" ry="5.5"/><ellipse cx="973" cy="56" rx="12" ry="5.5"/>
        <ellipse cx="1139" cy="56" rx="12" ry="5.5"/><ellipse cx="1304" cy="56" rx="12" ry="5.5"/>
        <ellipse cx="1470" cy="56" rx="12" ry="5.5"/>
      </g>
      <g fill="url(#glow)">
        <circle cx="146" cy="58" r="34"/><circle cx="311" cy="58" r="34"/><circle cx="477" cy="58" r="34"/>
        <circle cx="642" cy="58" r="34"/><circle cx="808" cy="58" r="34"/><circle cx="973" cy="58" r="34"/>
        <circle cx="1139" cy="58" r="34"/><circle cx="1304" cy="58" r="34"/><circle cx="1470" cy="58" r="34"/>
      </g>
