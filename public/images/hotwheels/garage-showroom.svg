    <rect x="24" y="915" width="1624" height="2.5" fill="#000" opacity="0.8"/>

    <!-- side pillars -->
    <rect x="24" y="24" width="40" height="893" fill="url(#pillar)"/>
    <rect x="1608" y="24" width="40" height="893" fill="url(#pillarR)"/>

