      <rect x="168" y="890" width="14" height="4"/><rect x="222" y="890" width="14" height="4"/>
      <rect x="276" y="890" width="14" height="4"/><rect x="330" y="890" width="14" height="4"/>
      <rect x="384" y="890" width="14" height="4"/><rect x="438" y="890" width="14" height="4"/>
      <rect x="492" y="890" width="14" height="4"/><rect x="546" y="890" width="14" height="4"/>
      <rect x="600" y="890" width="14" height="4"/><rect x="654" y="890" width="14" height="4"/>
      <rect x="708" y="890" width="14" height="4"/><rect x="762" y="890" width="14" height="4"/>
      <rect x="816" y="890" width="14" height="4"/><rect x="870" y="890" width="14" height="4"/>
      <rect x="924" y="890" width="14" height="4"/><rect x="978" y="890" width="14" height="4"/>
      <rect x="1032" y="890" width="14" height="4"/><rect x="1086" y="890" width="14" height="4"/>
      <rect x="1140" y="890" width="14" height="4"/><rect x="1194" y="890" width="14" height="4"/>
      <rect x="1248" y="890" width="14" height="4"/><rect x="1302" y="890" width="14" height="4"/>
      <rect x="1356" y="890" width="14" height="4"/><rect x="1410" y="890" width="14" height="4"/>
      <rect x="1464" y="890" width="14" height="4"/><rect x="1518" y="890" width="14" height="4"/>
      <rect x="1572" y="890" width="14" height="4"/>
