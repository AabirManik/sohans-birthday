    <ellipse cx="1122" cy="772" rx="150" ry="70" fill="url(#refW)"/>
    <ellipse cx="856" cy="764" rx="176" ry="82" fill="url(#refB)"/>
    <ellipse cx="500" cy="832" rx="300" ry="48" fill="url(#refY)"/>
    <ellipse cx="1360" cy="826" rx="220" ry="42" fill="url(#refY)"/>

