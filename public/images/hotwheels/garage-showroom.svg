      <rect width="72" height="26" fill="none"/>
      <path d="M0 25.5 H72 M36 0 V26 M72 0 V13 M0 13 H72" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1.4" fill="none"/>
    </pattern>
    <clipPath id="opening">
      <rect x="24" y="24" width="1624" height="893" rx="10"/>
    </clipPath>
  </defs>

