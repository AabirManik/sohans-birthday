      <path d="M 1292 496 L 1306 210 L 1466 468 L 1480 204"/>
    </g>
    <!-- black outlines -->
    <g stroke="#0a0a0b" stroke-width="124" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 330 235 C 295 180 150 175 128 252 C 110 322 298 315 298 398 C 298 478 155 490 112 435"/>
      <path d="M 470 198 C 588 183 662 250 656 352 C 650 462 558 508 468 492 C 378 476 348 400 354 310 C 360 226 402 203 470 198 Z"/>
      <path d="M 762 208 L 748 500 M 934 198 L 920 492 M 754 356 L 926 346"/>
      <path d="M 1012 496 L 1108 212 L 1204 492 M 1048 402 L 1170 394"/>
      <path d="M 1292 496 L 1306 210 L 1466 468 L 1480 204"/>
    </g>
