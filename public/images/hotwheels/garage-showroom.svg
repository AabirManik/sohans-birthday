<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941">
  <defs>
    <!-- ceiling light glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb45f" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#ff9a3d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff9a3d" stop-opacity="0"/>
    </radialGradient>
    <!-- light cone fade -->
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffca8a" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffca8a" stop-opacity="0"/>
    </linearGradient>
    <!-- top wash of light on the wall -->
    <linearGradient id="wallwash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb45f" stop-opacity="0.17"/>
      <stop offset="55%" stop-color="#ff9a3d" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ff9a3d" stop-opacity="0"/>
    </linearGradient>
    <!-- recess shadow under ceiling -->
    <linearGradient id="recess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <!-- side vignettes -->
    <linearGradient id="vigL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vigR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.8"/>
    </linearGradient>
    <!-- spray clouds behind the piece -->
    <radialGradient id="cloudP" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6a3fa0" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#6a3fa0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cloudR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a01f2a" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#a01f2a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cloudT" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f7a8c" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#1f7a8c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cloudO" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b0651f" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#b0651f" stop-opacity="0"/>
    </radialGradient>
    <!-- concrete floor -->
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f2b26"/>
      <stop offset="18%" stop-color="#665f55"/>
      <stop offset="62%" stop-color="#837b6f"/>
      <stop offset="100%" stop-color="#6c6459"/>
    </linearGradient>
    <!-- wheel contact shade -->
    <linearGradient id="wheelShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="55%" stop-color="#000" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <!-- pillar metal -->
    <linearGradient id="pillar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c1c20"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="pillarR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#1c1c20"/>
