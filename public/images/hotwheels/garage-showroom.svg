    <radialGradient id="refR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d92b2b" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#d92b2b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="refW" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ece7dc" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ece7dc" stop-opacity="0"/>
