    <radialGradient id="refB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7cc4e0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7cc4e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="refY" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd21e" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffd21e" stop-opacity="0"/>
